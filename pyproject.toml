[project]
name = "tenderlens"
version = "0.1.0"
description = "Finds every relevant Indian public tender, explains its documents with a self-hosted LLM, and runs the bid pipeline for a team."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "django-filter>=25.1",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.5",
    "redis>=5.2",
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "pydantic>=2.10",
    "rapidfuzz>=3.12",
    "gunicorn>=23.0",
    "google-auth>=2.38",
    "requests>=2.32",
    "whitenoise>=6.8",
    # Copilot: PDF text and embedding storage (pgvector).
    "pgvector>=0.3",
    "pymupdf>=1.25",
    "numpy>=2.0",
    "lightgbm>=4.5",
]

[project.optional-dependencies]
# The embedding model and reranker (~1.2 GB with torch). An extra, not a default, so a host
# that only serves the API (Vercel caps a Python function at 500 MB) can skip it. The Docker
# image, CI and local dev install it: `uv sync --extra copilot`.
copilot = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "ruff>=0.9",
    "respx>=0.22",
]

[tool.uv]
package = false

# CPU-only PyTorch: the CUDA wheels are ~2 GB and the web/worker image runs on a CPU server.
# Fine-tuning (GPU) lives in llm/ with its own pyproject.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # whitenoise warns when collectstatic has not run; irrelevant to tests
    "ignore:No directory at:UserWarning",
]
markers = [
    "models: loads the real embedding / reranker models (slow on the first run, downloads weights)",
    "llm: needs a running OpenAI-compatible LLM server at LLM_BASE_URL",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]
ignore = ["E501", "DJ008"]
