[project]
name = "tenderlens-llm"
version = "0.1.0"
description = "TenderLens LLM kit: tender RAG prompt, dataset builder, QLoRA fine-tuning, GGUF export, eval"
requires-python = ">=3.12,<3.14"
# The base install is what the dataset builder and the evaluator need; it runs on any laptop.
# Training pulls CUDA torch, so it is an extra and never goes into the web image.
dependencies = [
    "pymupdf>=1.25",
    "httpx>=0.27",
]

[project.optional-dependencies]
train = [
    "torch>=2.6",
    "transformers>=5.0",
    "peft>=0.17",
    "trl>=0.24",
    "bitsandbytes>=0.47",
    "datasets>=3.0",
    "accelerate>=1.5",
    # llama.cpp's convert_hf_to_gguf.py imports it unconditionally (export_gguf.py)
    "sentencepiece>=0.2",
]
# Optional, not wired into train_qlora.py yet: ~2x faster QLoRA with fused kernels. The plain
# PEFT + Trainer path is the default because it has fewer moving parts.
unsloth = ["unsloth>=2026.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["models", "out", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
