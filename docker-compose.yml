# Local development stack. `make up` starts everything; the site is http://localhost:8080.
# Same images and roles as production (deploy/compose.prod.yml, docs/DEPLOY.md), but plain
# HTTP, published database ports, Mailpit, and migrations on web start.
x-app: &app
  build: { context: ., target: app }
  image: tenderlens:latest
  env_file: .env
  environment: &app-env
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
    EMAIL_HOST: ${EMAIL_HOST:-mailpit}
    EMAIL_PORT: ${EMAIL_PORT:-1025}
    MEDIA_ROOT: /app/media
  volumes: ["media:/app/media"]     # uploaded tender PDFs (Copilot)
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16   # pgvector: Copilot chunk embeddings; pg_trgm: tender search
    environment:
      POSTGRES_DB: tenderlens
      POSTGRES_USER: tenderlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenderlens}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderlens -d tenderlens"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # broker survives restarts
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Catches every email in development: http://localhost:8025. In production set
  # EMAIL_HOST/EMAIL_PORT/EMAIL_HOST_USER/EMAIL_HOST_PASSWORD/EMAIL_USE_TLS in .env.
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped

  web:
    <<: *app
    command: ["web"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      retries: 10

  worker-crawl:
    <<: *app
    command: ["worker-crawl"]
    environment:
      <<: *app-env
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-8}

  worker:
    <<: *app
    command: ["worker"]

  beat:
    <<: *app
    command: ["beat"]
    volumes: ["media:/app/media", "beat:/var/lib/celery"]

  # Caddy with the built React app, as in production; SITE_ADDRESS=:80 means plain HTTP.
  proxy:
    build: { context: ., target: proxy }
    image: tenderlens-proxy:latest
    environment:
      SITE_ADDRESS: ":80"
    ports: ["${HTTP_PORT:-8080}:80"]
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped

  # Self-hosted Copilot LLM (llama.cpp, CPU), opt-in: `docker compose --profile llm up -d llm`
  # (needs the GGUF in llm/models, which is not on GitHub). Django inside compose then uses
  # LLM_BASE_URL=http://llm:8080/v1; from the host it is http://127.0.0.1:8081/v1.
  # Full service definition and the GPU variant: deploy/llm/compose.llm.yml.
  llm:
    profiles: ["llm"]
    extends: { file: deploy/llm/compose.llm.yml, service: llm }
    volumes: ["./llm/models:/models:ro"]   # extends would resolve it next to compose.llm.yml

volumes:
  pgdata:
  redisdata:
  media:
  beat:
