# Static React build + reverse proxy to gunicorn.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Re-resolve "web" through Docker's DNS. Without this, nginx keeps the IP it looked up at
# startup, and every redeploy that recreates the web container gives 502s until nginx
# is restarted. ("server ... resolve" needs nginx >= 1.27.3 and a shared zone.)
resolver 127.0.0.11 valid=10s ipv6=off;

upstream django {
    zone django 64k;
    server web:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    gzip on;
    gzip_types application/json text/css application/javascript;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Django admin and its static files (served by whitenoise inside Django).
    location ~ ^/(admin|static)/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional companion service (github.com/devreddy1015/docintel). Resolved per request
    # through a variable, so nginx starts and the site works even when it isn't running
    # (requests to /docintel/ then return 502 and the UI hides the feature).
    location /docintel/ {
        set $docintel http://docintel:8100;
        rewrite ^/docintel/(.*)$ /$1 break;
        proxy_pass $docintel;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;              # stream answers as they are written (SSE)
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        access_log off;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
