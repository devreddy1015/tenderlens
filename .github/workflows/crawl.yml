name: crawl
# Scheduled crawls for the Vercel deployment, which has no Celery worker or beat.
# Like CELERY_BEAT_SCHEDULE in config/settings.py, but the full crawl is weekly and old rows
# are pruned after every run, so the data fits a free 0.5 GB Postgres. A full crawl stores
# ~63 MB of detail pages and an incremental one ~5 MB of listing pages and ~2,700 crawl items.
on:
  schedule:
    - cron: "35 * * * *" # hourly incremental (:05 IST)
    - cron: "0 21 * * 6" # weekly full crawl (Sunday 02:30 IST)
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [incremental, full]
        default: incremental

concurrency:
  group: crawl # never two crawls at once; a queued run waits for the current one
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: crawler-does-not-sign-anything
      ES_ENABLED: "false"
      # No broker here: index_tender and send_alerts run inline after each commit.
      CELERY_TASK_ALWAYS_EAGER: "true"
      EMAIL_BACKEND: ${{ vars.EMAIL_BACKEND || 'django.core.mail.backends.console.EmailBackend' }}
      SITE_URL: ${{ vars.SITE_URL }}
      CRAWLER_SOURCES: ${{ vars.CRAWLER_SOURCES || 'central,mp' }}
      CRAWLER_TIMEOUT: "60" # MP portal intermittently needs longer to return listing pages
      RAW_LISTING_RETENTION_DAYS: "0" # only needed during the run
      RAW_DETAIL_RETENTION_DAYS: "2" # pages behind stored tenders are always kept
      CRAWL_ITEM_RETENTION_DAYS: "7" # run totals stay on crawl_run
      MODE: ${{ inputs.mode || (github.event.schedule == '0 21 * * 6' && 'full') || 'incremental' }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping the crawl."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
      - if: steps.cfg.outputs.skip != 'true'
        run: uv sync --frozen --no-dev
      - if: steps.cfg.outputs.skip != 'true'
        run: uv run python manage.py migrate --noinput
      - if: steps.cfg.outputs.skip != 'true'
        name: Crawl
        run: |
          status=0
          for source in ${CRAWLER_SOURCES//,/ }; do
            echo "::group::$source ($MODE)"
            uv run python manage.py crawl --source "$source" --mode "$MODE" --sync || status=1
            echo "::endgroup::"
          done
          exit $status
      - if: always() && steps.cfg.outputs.skip != 'true'
        name: Prune old rows
        run: |
          uv run python manage.py shell -c "
          from ingest import tasks
          print('raw pages deleted:', tasks.prune_raw_pages())
          print('crawl items deleted:', tasks.prune_crawl_items())"
