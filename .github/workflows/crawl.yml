name: crawl
# Scheduled jobs for the Vercel deployment, which has no Celery worker or beat (the VPS stack
# in deploy/ runs them on Celery instead). Like CELERY_BEAT_SCHEDULE in config/settings.py,
# but the full crawl is weekly and old rows are pruned before and after every run, so the
# data fits a free 0.5 GB Postgres. When it fills up anyway, reclaim_space truncates the
# stored HTML (re-fetched by the next crawl) before anything needs to write. A full
# crawl keeps detail pages only for new or changed tenders (re-fetching every unchanged one
# once filled the database), and an incremental one stores ~5 MB of listing pages and
# ~2,700 crawl items.
on:
  schedule:
    - cron: "35 * * * *" # hourly incremental (:05 IST)
    - cron: "0 21 * * 6" # weekly full crawl (Sunday 02:30 IST)
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        # migrate: reclaim space, prune and migrate only (run it right before a deploy
        # whose migrations the live site needs).
        options: [incremental, full, migrate]
        default: incremental

concurrency:
  group: crawl # never two crawls at once; a queued run waits for the current one
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_SECRET_KEY: crawler-does-not-sign-anything
      # No broker here: send_alerts runs inline after each commit.
      CELERY_TASK_ALWAYS_EAGER: "true"
      EMAIL_BACKEND: ${{ vars.EMAIL_BACKEND || 'django.core.mail.backends.console.EmailBackend' }}
      SITE_URL: ${{ vars.SITE_URL }}
      CRAWLER_SOURCES: ${{ vars.CRAWLER_SOURCES || 'central,mp' }}
      CRAWLER_TIMEOUT: "60" # the MP portal sometimes takes over 30 s to return a listing page
      RAW_LISTING_RETENTION_DAYS: "0" # only needed during the run
      RAW_DETAIL_RETENTION_DAYS: "0" # pages behind stored tenders are always kept; unchanged re-fetches are not
      CRAWL_ITEM_RETENTION_DAYS: "7" # run totals stay on crawl_run
      MODE: ${{ inputs.mode || (github.event.schedule == '0 21 * * 6' && 'full') || 'incremental' }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping the crawl."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cfg.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.cfg.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5
      - if: steps.cfg.outputs.skip != 'true'
        run: uv sync --frozen --no-dev
      - if: steps.cfg.outputs.skip != 'true'
        name: Reclaim space
        # Near the 512 MB cap nothing can be written, not even a migration: truncate the
        # stored HTML and crawl items first (tenders, users and alerts stay).
        run: uv run python manage.py reclaim_space --if-over-mb 460
      - if: steps.cfg.outputs.skip != 'true'
        name: Prune old rows
        # Before migrating too, so a migration that rewrites a table finds the space.
        run: uv run python manage.py prune
      - if: steps.cfg.outputs.skip != 'true'
        run: uv run python manage.py migrate --noinput
      - if: steps.cfg.outputs.skip != 'true' && env.MODE != 'migrate'
        name: Crawl
        run: |
          status=0
          for source in ${CRAWLER_SOURCES//,/ }; do
            echo "::group::$source ($MODE)"
            uv run python manage.py crawl --source "$source" --mode "$MODE" --sync || status=1
            echo "::endgroup::"
          done
          exit $status
      - if: always() && steps.cfg.outputs.skip != 'true' && env.MODE != 'migrate'
        name: Beat jobs
        # The Celery beat entries that are not crawls: close runs a killed job left open,
        # rebuild the typo-correction word list, and once a day (the 02:35 UTC run, 08:05 IST)
        # email pipeline reminders.
        run: |
          uv run python manage.py shell -c "
          from ingest.tasks import close_stale_runs
          from tenders.tasks import refresh_search_words
          print('stale runs closed:', close_stale_runs())
          refresh_search_words()
          "
          if [ "$(date -u +%H)" = "02" ]; then
            uv run python manage.py shell -c "
          from workspaces.tasks import send_pipeline_reminders
          print('pipeline reminders sent:', send_pipeline_reminders())
          "
          fi
      - if: always() && steps.cfg.outputs.skip != 'true'
        name: Prune old rows after the crawl
        run: uv run python manage.py prune
