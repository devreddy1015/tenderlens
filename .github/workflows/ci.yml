name: ci
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tenderlens
          POSTGRES_USER: tenderlens
          POSTGRES_PASSWORD: tenderlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenderlens" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
      # Copilot tests set EMBEDDING_MODEL=fake, so no model is downloaded here.
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra copilot
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      # No LLM server in CI: tests marked `llm` need one at LLM_BASE_URL.
      - run: uv run pytest -m "not llm"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The production images (deploy/compose.prod.yml), built but never pushed: a broken
  # Dockerfile, apt package, frontend build or Caddyfile fails here instead of on the VPS.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose files
        run: |
          printf '%s\n' SITE_ADDRESS=ci.example.in ACME_EMAIL=ci@example.in POSTGRES_PASSWORD=ci > ci.env
          TL_ENV_FILE=../ci.env docker compose -f deploy/compose.prod.yml --env-file ci.env config -q
          TL_ENV_FILE=../ci.env COMPOSE_PROFILES=llm docker compose -f deploy/compose.prod.yml --env-file ci.env config -q
          cp .env.example .env && docker compose config -q
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          tags: tenderlens:ci
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build proxy image (React app + Caddy, validates the Caddyfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: proxy
          tags: tenderlens-proxy:ci
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy
      - name: Smoke-test the app image
        run: |
          docker run --rm --entrypoint sh tenderlens:ci -c \
            'ocrmypdf --version && tesseract --list-langs | grep -qx hin && python manage.py check'
