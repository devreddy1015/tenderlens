<!-- Source of the PWA icons in public/icons (the favicon's mark on a full-bleed square, inside
     the maskable safe zone). Regenerate with:
       rsvg-convert -w 192 -h 192 public/favicon.svg -o public/icons/icon-192.png
       rsvg-convert -w 512 -h 512 public/favicon.svg -o public/icons/icon-512.png
       rsvg-convert -w 192 -h 192 icons/maskable.svg -o public/icons/maskable-192.png
       rsvg-convert -w 512 -h 512 icons/maskable.svg -o public/icons/maskable-512.png
       rsvg-convert -w 180 -h 180 icons/apple-touch.svg -o public/apple-touch-icon.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="#0a0a0b"/><g transform="translate(6.4 6.4) scale(0.8)" fill="none"><path d="M3 8.5V3h5.5M15.5 3H21v5.5M21 15.5V21h-5.5M8.5 21H3v-5.5" stroke="#f3f2ee" stroke-width="2.1" stroke-linecap="square"/><path d="M8.6 15.4 14.6 9.4" stroke="#f3f2ee" stroke-opacity=".6" stroke-width="1.5"/><circle cx="8.4" cy="15.6" r="1.6" fill="#f3f2ee"/><circle cx="15" cy="9" r="2.7" fill="#f5a524"/></g></svg>
